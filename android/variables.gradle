ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'

    // play-services-auth 20.7.0 (the @capacitor-firebase/authentication default) has a
    // long-standing Google bug: SignInHubActivity.onCreate throws NullPointerException on
    // "Attempt to invoke virtual method ... getClass() on a null object reference" because
    // it's pulled in via the old androidx.credentials:credentials-play-services-auth:1.2.0-rc01
    // pre-release. Pinning both to current stable releases avoids the crash.
    // See: https://github.com/firebase/firebase-android-sdk/issues/8135
    playServicesAuthVersion = '22.0.0'
    androidxCredentialsVersion = '1.5.0'
    androidxCredentialsPlayServicesAuthVersion = '1.5.0'
}